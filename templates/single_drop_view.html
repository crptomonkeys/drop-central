<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Job/Drop</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 100px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            margin-top: 50px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #28a745;
            text-align: center;
        }

        .form-group button {
            width: 100%;
            border-radius: 20px;
            background-color: #ffc107;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #e0a800;
        }

        .search-section {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .job-details, .drop-details {
            display: none;
            text-align: left;
        }

        .job-info {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
            margin-bottom: 20px;
        }

        .job-info h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffc107;
        }

        .form-group select {
            width: 100%;
            border-radius: 20px;
            padding: 10px;
            margin-top: 10px;
        }

        .drop-box {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
            position: relative;
        }

        .drop-box .box-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #28a745; /* Green color */
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
        }

        .drop-box .box-btn:hover {
            background: #218838;
        }

        .drop-box h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffc107;
        }

        .status-tx {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-symbol {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .status-pending {
            background: orange;
        }

        .status-completed {
            background: green;
        }

        .status-failed {
            background: red;
        }

        .tx-btn a {
            text-decoration: none;
            color: white;
            background: #28a745;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
        }

        .tx-btn a:hover {
            background: #218838;
        }

        .time {
            text-align: right;
            color: grey;
            font-size: 14px;
            margin-top: 20px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #28a745;
            color: white;
            text-align: center;
            padding: 10px 0;
        }

        .banana {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-image: url('banana.png');
            background-size: cover;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Search CM Job/Drop</h1>
        <div class="search-section">
            <div class="form-group">
                <label for="jobOrDropId">Job/Drop ID</label>
                <input type="text" class="form-control" id="jobOrDropId" placeholder="Enter job or drop ID">
            </div>
            <div class="form-group">
                <button class="btn btn-primary" onclick="fetchData()">Search</button>
            </div>
            <div class="error" id="error"></div>
        </div>

        <div class="job-details" id="jobDetails">
            <div class="job-info">
                <h2>Job Information</h2>
                <p><strong>Job ID:</strong> <span id="jobIdInfo"></span></p>
                <p><strong>Application:</strong> <span id="applicationInfo"></span></p>
            </div>

            <div class="form-group">
                <label for="dropSelect">Select a drop:</label>
                <select id="dropSelect" class="form-control" onchange="displaySelectedDrop()">
                    <option value="" disabled selected>Select a drop</option>
                </select>
            </div>
        </div>

        <div class="drop-details" id="dropDetails">
            <div class="drop-box">
                <h2>Receiver</h2>
                <p id="receiver"></p>
                <a id="receiverLink" class="box-btn" href="#" target="_blank">View Account</a>
            </div>
            <div class="drop-box">
                <h2>Memo</h2>
                <p id="memo"></p>
            </div>
            <div class="drop-box">
                <h2>Asset ID</h2>
                <p id="assetId"></p>
                <a id="assetLink" class="box-btn" href="#" target="_blank">View Asset</a>
            </div>
            <div class="status-tx">
                <div class="status">
                    <div id="statusSymbol" class="status-symbol"></div>
                    <span id="status"></span>
                </div>
                <div class="tx-btn">
                    <a id="chainTxId" href="#" target="_blank">View Transaction</a>
                </div>
            </div>
            <div class="time" id="time"></div>
        </div>
    </div>

    <div class="banana"></div>

    <div class="footer">
        © 2024 cryptomonKeys. All rights reserved.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const jobOrDropId = urlParams.get('id');

            if (jobOrDropId) {
                document.getElementById('jobOrDropId').value = jobOrDropId;
                fetchData();
            }
        });

        let dropData = [];

        async function fetchData() {
            const inputId = document.getElementById('jobOrDropId').value.trim();
            const dropDetails = document.getElementById('dropDetails');
            const jobDetails = document.getElementById('jobDetails');
            const dropSelect = document.getElementById('dropSelect');
            const errorElement = document.getElementById('error');

            if (!inputId) {
                errorElement.textContent = 'Please enter a Job or Drop ID';
                return;
            }

            dropDetails.style.display = 'none';
            jobDetails.style.display = 'none';
            errorElement.textContent = '';
            dropSelect.innerHTML = '<option value="" disabled selected>Select a drop</option>'; // Reset dropdown

            try {
                let response;
                if (inputId.startsWith('job_')) {
                    response = await fetch(`/transfers?jobId=${inputId}`);
                } else {
                    response = await fetch(`/transfers?id=${inputId}`);
                }
                console.log(response.content)

                if (!response.ok) {
                    throw new Error('ID not found');
                }

                const data = await response.json();

                console.log(data)
                
                if (data.length > 1) {
                    document.getElementById('jobIdInfo').textContent = data[0].jobId;
                    document.getElementById('applicationInfo').textContent = data[0].application;

                    dropData = data;
                    dropData.forEach((drop, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `Drop ${index + 1} - Receiver: ${drop.receiver}`;
                        dropSelect.appendChild(option);
                    });

                    jobDetails.style.display = 'block';

                } else {
                    dropData = data;
                    displaySelectedDrop(0);
                }
            } catch (error) {
                errorElement.textContent = error.message;
            }
        }

        function displaySelectedDrop(selectedIndex) {
            const dropDetails = document.getElementById('dropDetails');
            if (selectedIndex === undefined) {
                selectedIndex = document.getElementById('dropSelect').value;
            }

            if (dropData[selectedIndex]) {
                const selectedDrop = dropData[selectedIndex];
                console.log(selectedDrop)

                document.getElementById('receiver').textContent = selectedDrop.receiver;
                document.getElementById('receiverLink').href = `https://waxblock.io/account/${selectedDrop.receiver}`;

                document.getElementById('memo').textContent = selectedDrop.memo;

                document.getElementById('assetId').textContent = selectedDrop.assetId;
                document.getElementById('assetLink').href = `https://wax.atomichub.io/explorer/asset/${selectedDrop.assetId}`;

                const status = selectedDrop.status.toLowerCase();
                const statusSymbol = document.getElementById('statusSymbol');
                statusSymbol.classList.remove('status-pending', 'status-completed', 'status-failed');
                if (status === 'completed') {
                    statusSymbol.classList.add('status-completed');
                } else if (status === 'pending') {
                    statusSymbol.classList.add('status-pending');
                } else {
                    statusSymbol.classList.add('status-failed');
                }

                document.getElementById('status').textContent = selectedDrop.status;

                document.getElementById('chainTxId').href = `https://waxblock.io/transaction/${selectedDrop.chainTxId}`;

                document.getElementById('time').textContent = new Date(selectedDrop.time).toLocaleString();

                dropDetails.style.display = 'block';
            }
        }
    </script>
</body>
</html>
